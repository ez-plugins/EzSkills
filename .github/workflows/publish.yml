# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  RELEASE PIPELINE
#
#  1. Build           — compile all modules and produce the shaded plugin JAR
#  2. Locate JAR      — find the shaded ezskills-plugin artifact
#  3. Extract info    — version string + changelog section from CHANGELOG.md
#  4. GitHub Packages — deploy API + plugin JARs to GitHub Packages (Maven)
#  5. GitHub Release  — create the GH release with the plugin JAR attached
#  6. Modrinth        — upload the plugin JAR (skips if already uploaded)
#
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v2.0.0)'
        required: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:

      # ────────────────────────────────────────────────────────────────────────
      #  1. CHECKOUT & BUILD
      # ────────────────────────────────────────────────────────────────────────

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Build all modules
        run: mvn clean package -B -DskipTests

      # ────────────────────────────────────────────────────────────────────────
      #  2. LOCATE ARTIFACT
      # ────────────────────────────────────────────────────────────────────────

      - name: Locate shaded plugin JAR
        id: jars
        run: |
          JAR=$(ls ezskills-plugin/target/ezskills-plugin-*.jar | grep -v 'original' | head -1)
          echo "plugin=$JAR" >> "$GITHUB_OUTPUT"

      # ────────────────────────────────────────────────────────────────────────
      #  3. EXTRACT VERSION & CHANGELOG
      # ────────────────────────────────────────────────────────────────────────

      - name: Extract version from tag
        id: meta
        run: |
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          echo "ref=${REF}"       >> "$GITHUB_OUTPUT"
          echo "version=${REF#v}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          NOTES=$(awk \
            "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" \
            CHANGELOG.md | sed '/^[[:space:]]*$/d' | sed '/^###/!b; s/^### /\n### /')
          if [[ -z "$NOTES" ]]; then
            NOTES="See [CHANGELOG.md](https://github.com/ez-plugins/EzSkills/blob/main/CHANGELOG.md) for details."
          fi
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # ────────────────────────────────────────────────────────────────────────
      #  4. GITHUB PACKAGES
      # ────────────────────────────────────────────────────────────────────────

      - name: Publish to GitHub Packages
        run: mvn -B -DskipTests deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      # ────────────────────────────────────────────────────────────────────────
      #  5. GITHUB RELEASE
      # ────────────────────────────────────────────────────────────────────────

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.ref }}
          name: "EzSkills ${{ steps.meta.outputs.ref }}"
          body: |
            ## What's Changed

            ${{ steps.changelog.outputs.notes }}

            ---

            ### Download
            | JAR | Target |
            |-----|--------|
            | `ezskills-plugin-${{ steps.meta.outputs.version }}.jar` | Paper / Spigot 1.21+ |

            **API dependency (Maven/Gradle):** see [Getting Started](https://ez-plugins.github.io/EzSkills/getting_started).

            Full documentation: https://ez-plugins.github.io/EzSkills/
          files: ${{ steps.jars.outputs.plugin }}
          fail_on_unmatched_files: true

      # ────────────────────────────────────────────────────────────────────────
      #  6. MODRINTH
      #
      #  Loaders : paper, folia, purpur, spigot, bukkit
      #  Skips   : if this version was already uploaded
      #
      #  Before first release: create the project on https://modrinth.com and
      #  replace YOUR_MODRINTH_PROJECT_ID with the project's ID string, then
      #  add MODRINTH_TOKEN to repository secrets.
      # ────────────────────────────────────────────────────────────────────────

      - name: Upload plugin JAR to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          PLUGIN_JAR="${{ steps.jars.outputs.plugin }}"
          PLUGIN_FILENAME=$(basename "$PLUGIN_JAR")
          VERSION="${{ steps.meta.outputs.version }}"

          CHANGELOG=$(cat << 'ENDOFCHANGELOG'
          ${{ steps.changelog.outputs.notes }}
          ENDOFCHANGELOG
          )

          VERSION="$VERSION" CHANGELOG="$CHANGELOG" python3 -c "
          import json, os
          v = os.environ['VERSION']
          c = os.environ['CHANGELOG']
          print(json.dumps({
              'name':          f'EzSkills {v}',
              'version_number': v,
              'changelog':     c,
              'dependencies':  [
                  {'project_id': 'rCku0I4l', 'dependency_type': 'optional'}
              ],
              'game_versions': [
                  '1.21','1.21.1','1.21.2','1.21.3','1.21.4','1.21.5',
                  '1.21.6','1.21.7','1.21.8','1.21.9','1.21.10','1.21.11',
                  '26.1','26.1.1','26.1.2'
              ],
              'version_type':  'release',
              'loaders':       ['paper','folia','purpur','spigot','bukkit'],
              'featured':      True,
              'project_id':    'YOUR_MODRINTH_PROJECT_ID',
              'primary_file':  'plugin_jar',
              'file_parts':    ['plugin_jar']
          }))" > /tmp/modrinth_payload.json

          HTTP_CODE=$(curl -s -o /tmp/modrinth.json -w '%{http_code}' \
            --retry 3 --retry-delay 10 --retry-all-errors \
            -X POST https://api.modrinth.com/v2/version \
            -H "Authorization: $MODRINTH_TOKEN" \
            -F "data=</tmp/modrinth_payload.json" \
            -F "plugin_jar=@${PLUGIN_JAR};filename=${PLUGIN_FILENAME}")

          echo "Modrinth response (HTTP $HTTP_CODE):"
          cat /tmp/modrinth.json
          echo ""

          if [[ "$HTTP_CODE" =~ ^2 ]]; then
            echo "Plugin JAR uploaded successfully."
          elif grep -q 'already exists' /tmp/modrinth.json 2>/dev/null; then
            echo "Version already exists on Modrinth — skipping."
          else
            echo "Upload failed!"
            exit 1
          fi
